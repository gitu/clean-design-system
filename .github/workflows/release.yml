# Publishes to npm when a version tag is pushed.
#
#   pnpm version minor && git push --follow-tags
#
# Uses npm's trusted publishing (OIDC) rather than a long-lived NPM_TOKEN: the
# `id-token: write` permission below lets npm verify the publish came from this
# workflow, in this repository, and nowhere else. It also means every published
# tarball carries a provenance attestation — cryptographic proof of the commit
# and the run that built it.
#
# One-time setup, and it has to happen in this order:
#
#   1. `npm publish` once from a laptop. npm cannot attach a trusted publisher
#      to a package name that does not exist yet.
#   2. Point npm at this workflow, from a laptop with npm >= 12:
#        npm trust github clean-design-system \
#          --repo gitu/clean-design-system --file release.yml --allow-publish
#      (or npmjs.com → the package → Settings → Trusted Publisher)
#   3. Every release after that is a tag.
#
# Until step 2 is done this workflow will fail at the publish step, which is the
# correct failure: nothing should be able to publish that npm has not been told
# to trust.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, and reports of it failing on
          # Node 22 are common enough that 24 is the safer floor. setup-node
          # ships an older npm with every Node line, so npm is upgraded
          # explicitly rather than left to whatever came bundled.
          #
          # Deliberately no `registry-url`. It writes an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}`, and with no token in the
          # environment npm sends an empty credential and authenticates as
          # nobody — which surfaces as a 404 on a package that plainly exists.
          # OIDC needs no .npmrc at all.
          node-version: 24
          cache: pnpm

      - run: npm install -g npm@latest
      - run: npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The same gates the docs site deploys behind. A release is the one moment
      # where "it built" is not good enough — a published version cannot be
      # taken back, only superseded.
      - run: pnpm typecheck
      - run: pnpm check-tokens
      - run: pnpm check-palette
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm test

      # Packs the tarball, installs it into an empty project and uses it. This
      # is the only check that exercises the `exports` map and `files` list,
      # which is where publishing goes wrong.
      - run: pnpm check-package

      # The tag has to agree with package.json, or the registry ends up with a
      # version nobody can find by the tag that produced it.
      - name: Check the tag matches the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # `--ignore-scripts`: prepublishOnly has already run above, step by step,
      # where a failure names the gate that failed rather than the script.
      #
      # `--provenance` is passed explicitly even though npm documents it as
      # automatic under trusted publishing. The reports disagree, the flag is a
      # no-op when it is already on, and the attestation is the entire reason
      # for publishing this way — so it is stated rather than assumed.
      - run: npm publish --provenance --ignore-scripts
