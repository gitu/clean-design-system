# Publishes to GitHub Packages when a version tag is pushed.
#
#   pnpm version minor && git push --follow-tags
#
# No stored credential. `GITHUB_TOKEN` is minted for this run by Actions, and
# `packages: write` below is the only permission it needs — which is the whole
# argument for GitHub Packages over npmjs.com here: nothing long-lived to
# rotate, revoke or leak.
#
# The cost lands on consumers rather than on us, and it is real: GitHub Packages
# requires authentication to *install*, even for a public package. Anyone using
# this as a dependency needs a personal access token with `read:packages` and an
# .npmrc pointing @gitu at the registry. The README says so.
#
# The unauthenticated route is the shadcn registry on GitHub Pages, which is
# plain JSON over HTTPS and needs no account at all.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Writes the .npmrc that points the scope at GitHub Packages and reads
          # NODE_AUTH_TOKEN. Required here — unlike npmjs.com's OIDC publishing,
          # GitHub Packages authenticates with a bearer token.
          registry-url: https://npm.pkg.github.com
          scope: '@gitu'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The same gates the docs site deploys behind. A release is the one moment
      # where "it built" is not good enough — a published version cannot be
      # taken back, only superseded.
      - run: pnpm typecheck
      - run: pnpm check-tokens
      - run: pnpm check-palette
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm test

      # Packs the tarball, installs it into an empty project and uses it. The
      # only check that exercises the `exports` map and `files` list, which is
      # where publishing goes wrong.
      - run: pnpm check-package

      # The tag has to agree with package.json, or the registry ends up with a
      # version nobody can find by the tag that produced it.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      # Re-running a tag, or dispatching by hand, should not fail on a version
      # that is already up. It should say so and stop.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — nothing to do."
            exit 0
          fi
          # prepublishOnly already ran above, step by step, where a failure
          # names the gate rather than the script.
          npm publish --ignore-scripts
          echo "published $NAME@$VERSION"
