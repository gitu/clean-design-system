# Publishes the documentation site to GitHub Pages on every push to the default
# branch: a landing page at the root, the component documentation under
# /storybook/, the sample applications under /examples/, and the shadcn registry
# at /r/ — one artefact, one deploy.
#
# The Storybook *is* the documentation for this package: every component's props
# table is generated from its JSDoc, and the Patterns stories are the only place
# the system is shown composing into real screens. A design system whose docs
# only run on the author's laptop is a design system nobody adopts.
name: Site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a queued deploy finishes
# rather than being dropped by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The story tests run in a real browser, so it has to be fetched. Only
      # Chromium — the a11y and interaction assertions are not browser-specific,
      # and three engines would triple the wait for no extra signal.
      - run: pnpm exec playwright install --with-deps chromium

      # The same gates that run locally. A Storybook that deploys green while
      # the token or palette checks are failing is worse than no deploy.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check-tokens
      - run: pnpm check-palette
      - run: pnpm build
      - run: pnpm smoke
      # Every story, with axe violations as failures.
      - run: pnpm test

      # Builds site-dist/ in one go: the registry is generated from src/, the
      # landing page and the examples are built around it, and the Storybook
      # goes in underneath at /storybook/. Everything published therefore comes
      # from one commit, which is the only way the registry and the docs
      # describing it can be trusted to agree.
      - run: pnpm build-site

      # Then every page of it is opened, one at a time, in the browser installed
      # above. A story that renders under Storybook and throws as a standalone
      # page is invisible to every other gate here, and a Pages deploy of
      # twenty-one blank screens is a worse outcome than a red build.
      - run: pnpm check-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
